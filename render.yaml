services:
  - type: web
    name: zk-file-sharing-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

  - type: web
    name: zk-file-sharing-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
